          if (pendingScAction?.type === 'edit')   handleEdit(pendingScAction.data);
          if (pendingScAction?.type === 'delete') deleteSalesData(pendingScAction.data.id);
          setPendingScAction(null);
        } else { setScPwdError(true); setScPwdInput(''); }
      };
      const setCardColor = (id, palette) => { const next = { ...cardColors, [id]: palette }; setCardColors(next); safeLS.set('summaryCardColors', JSON.stringify(next)); setColorPickerOpen(null); };

      // ── 분기 표기 정규화: "2026Q4", "2026 q4", "2026-Q4" → "2026 Q4" ──
      const normalizeQuarter = (s) => {
        const m = String(s||'').trim().match(/^(\d{4})\s*[-_]?\s*[Qq]\s*([1-4])$/);
        return m ? `${m[1]} Q${m[2]}` : null;
      };

      // ── Firestore 구독 ──────────────────────────────────────────────────
      useEffect(() => {
        if (!currentUser) return;
        const unsubSales        = db.collection("sales").onSnapshot(snap => setRawSalesData(snap.docs.map(d => d.data())));
        const unsubCandidates   = db.collection("sf_candidates").where("used","==",false).onSnapshot(snap => setCandidates(snap.docs.map(d => d.data())));
        const unsubTargets      = db.collection("targets").doc("quarterTargets").onSnapshot(doc => { if (doc.exists) setQuarterTargets(doc.data()); });
        const unsubMemberTargets= db.collection("targets").doc("memberTargets").onSnapshot(doc => {
          if (!doc.exists) return;
          const raw = doc.data();
          // [FIX #분기별 개인목표] 과거 저장 형식({member:number})이면 분기별 형식으로 1회 변환한다.
          // (값이 숫자면 레거시, 객체면 이미 분기별 형식)
          const isLegacyFlat = Object.values(raw).some(v => typeof v === 'number');
          if (isLegacyFlat) {
            const migrated = {};
            (quartersRef.current.length ? quartersRef.current : [selectedQuarter]).forEach(q => { migrated[q] = { ...raw }; });
            setMemberTargets(migrated);
            db.collection("targets").doc("memberTargets").set(migrated).catch(() => {});
          } else {
            setMemberTargets(raw);
          }
        });
        const unsubTeamTargets  = db.collection("targets").doc("teamTargets").onSnapshot(doc => { if (doc.exists) setTeamTargets(doc.data()); });
        const unsubDealerReq    = db.collection("settings").doc("dealerRequests").onSnapshot(
          doc => { const l = doc.exists ? doc.data().list : null; setDealerRequests(Array.isArray(l) ? l : []); }, () => {});
        const unsubLayout       = db.collection("settings").doc("layout").onSnapshot(doc => {
          if (doc.exists) {
            const data = doc.data();
            if (data.teams && typeof data.teams === 'object') setTeams(data.teams);
            // dealers가 아직 없는 문서면 기본 목록을 한 번 심어준다(기존 배포분 호환).
            if (Array.isArray(data.dealers) && data.dealers.length) setDealers(data.dealers);
            else if (auth.currentUser) db.collection("settings").doc("layout").set({ dealers: DEFAULT_DEALERS }, { merge: true });
            if (data.quarters && Array.isArray(data.quarters)) {
              const cleaned = [...new Set(data.quarters.map(q => normalizeQuarter(q) || q))].sort();
              setQuarters(cleaned);
              if (auth.currentUser && JSON.stringify(cleaned) !== JSON.stringify(data.quarters)) {
                db.collection("settings").doc("layout").set({ quarters: cleaned }, { merge: true });
              }
            }
          } else if (auth.currentUser) {
            db.collection("settings").doc("layout").set({ teams, quarters, dealers: DEFAULT_DEALERS });
          }
        });
        return () => { unsubSales(); unsubCandidates(); unsubTargets(); unsubMemberTargets(); unsubTeamTargets(); unsubLayout(); unsubDealerReq(); };
      }, [currentUser]);

      // 커미션 참조 데이터 - { SO번호: 수수료 } 맵. 금액 정보라 정적 파일로 두면 인증 없이
      // 공개되므로(저장소가 public) settings 컬렉션에 보관해 로그인 사용자만 읽게 한다.
      // 없거나 깨져도 대시보드는 그대로 동작해야 하므로 실패는 조용히 무시(커미션 토글만 0원 처리됨).
      React.useEffect(() => {
        if (!currentUser) return;
        const unsub = db.collection("settings").doc("commissions").onSnapshot(
          doc => { const d = doc.exists ? (doc.data() || {}).bySo : null; if (d && typeof d === 'object') setCommissions(d); },
          () => {}
        );
        return () => unsub();
      }, [currentUser]);

      // ── 미선적 자동 이월 (분기 시작일 감지): 이전 분기 ACT·Pending·Back up → 현재 분기로 이동 ──
      useEffect(() => {
        if (rawSalesData.length === 0) return;
        if (!currentUser) return; // 미선적 이월은 로그인된 사용자가 접속했을 때만 수행

        // 현재 날짜 기준으로 해당 분기 계산
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1; // 1~12
        const qNum = month <= 3 ? 1 : month <= 6 ? 2 : month <= 9 ? 3 : 4;
        const currentQ = `${year} Q${qNum}`;

        // 이전 분기 계산
        let prevYear = year, prevQNum = qNum - 1;
        if (prevQNum === 0) { prevQNum = 4; prevYear = year - 1; }
        const prevQ = `${prevYear} Q${prevQNum}`;

        // 이미 이월 처리했는지 확인 (Firestore 플래그)
        const rolloverKey = `rollover_${currentQ.replace(' ', '_')}`;
        db.collection("settings").doc("rollover").get().then(doc => {
          const flags = doc.exists ? doc.data() : {};
          if (flags[rolloverKey]) return; // 이미 처리됨

          // 이전 분기의 미선적(Ship Confirm 아님) 데이터 = ACT + Pending + Back up
          const carryOver = rawSalesData.filter(d => d.quarter === prevQ && d.status !== 'Ship Confirm');
          if (carryOver.length === 0) return;

          // quarters 목록에 현재 분기 없으면 추가
          const needsQuarter = !quarters.includes(currentQ);

          const batch = db.batch();

          // 이동: 기존 문서의 분기만 현재 분기로 변경 (이전 분기에서는 빠지고 현재 분기에만 남음)
          carryOver.forEach(d => {
            batch.update(db.collection("sales").doc(String(d.id)), { quarter: currentQ });
          });

          // 롤오버 플래그 저장
          batch.set(db.collection("settings").doc("rollover"), { ...flags, [rolloverKey]: true }, { merge: true });

          batch.commit().then(() => {
            if (needsQuarter) {
              const nq = [...quarters, currentQ].sort();
              setQuarters(nq);
              db.collection("settings").doc("layout").set({ quarters: nq }, { merge: true });
            }
            showToast(
              `${prevQ} 미선적 ${carryOver.length}건(ACT·Pending·Back up) → ${currentQ}으로 이동됐습니다 ✓`,
              'success'
            );
          });
        });
      }, [rawSalesData.length, currentUser]);

      // ── [FIX #2] 강화된 저장 검증 ────────────────────────────────────────
      const handleSave = () => {
        if (isSaving) return;
        if (!requireAuth()) return;
        const errors = [];
        if (!form.account.trim())                              errors.push(T.valAccount);
        if (!form.status)                                      errors.push(T.valStatus);
        if (!form.deliveryDate)                                errors.push(T.valDelivery);
        const krw = parseFloat(form.priceKRW);
        if (form.priceKRW !== '' && isNaN(krw))               errors.push(T.valPriceNaN);
        else if (!isNaN(krw) && krw < 0)                      errors.push(T.valPriceNeg);
        else if (!isNaN(krw) && krw > 10_000_000_000)         errors.push(T.valPriceBig);

        if (errors.length > 0) { alert(errors.join('\n')); return; }

        setIsSaving(true);
        const finalKRW = isNaN(krw) ? 0 : Math.round(krw);
        const payload = {
          status:       String(form.status || ''),
          contractType: String(form.contractType || '일반'),
          contractDate: String(form.contractDate || ''),
          deliveryDate: String(form.deliveryDate || ''),
          so:           String(form.so || ''),
          account:      String(form.account || ''),
          product:      String(form.product || 'GMPP'),
          accType:      String(form.accType || ''),
          dealerName:   String(form.dealerName || ''),
          priceKRW:     finalKRW,
          priceUSD:     parseFloat((finalKRW / (currentER || 1389)).toFixed(2)),
          id:           editingId ? String(editingId) : (convertingCandidateId || crypto.randomUUID()),
          quarter:      selectedQuarter,
          team:         selectedTeam,
          member:       selectedMember,
        };

        // 수정 전 스냅샷 (edit인 경우)
        const beforeSnap = editingId ? rawSalesData.find(d => String(d.id) === String(editingId)) : null;
        const auditAction = editingId ? 'edit' : 'create';

        db.collection("sales").doc(payload.id).set(payload)
          .then(() => {
            // ── Audit Log 기록 ──
            const logEntry = {
              action:    auditAction,
              actor:     (auth.currentUser?.email || ''),
              timestamp: new Date().toISOString(),
              member:    payload.member,
              team:      payload.team,
              quarter:   payload.quarter,
              account:   payload.account,
              after:     payload,
            };
            if (beforeSnap) logEntry.before = beforeSnap;
            db.collection("audit_logs").add(logEntry).catch(e => showToast((lang==='ko' ? '⚠️ 감사 로그 기록 실패: ' : '⚠️ Audit log failed: ') + e.message, 'error'));

            // Salesforce 후보에서 가져온 저장이면, 그 후보를 사용 완료 처리 (목록에서 사라짐)
            // + 같은 오퍼튜니티에서 같이 딸려온 동반 시스템(예: Cryo7)도 상태/날짜/Dealer를 공유해서 함께 저장
            if (convertingCandidateId) {
              const nowIso = new Date().toISOString();
              const actor = auth.currentUser?.email || '';
              db.collection("sf_candidates").doc(convertingCandidateId).update({
                used: true, usedAt: nowIso, usedBy: actor,
              }).catch(() => {});

              companionCandidates.forEach(comp => {
                const compKRW = comp.priceKRW || 0;
                const compPayload = {
                  status: payload.status, contractType: payload.contractType, contractDate: payload.contractDate,
                  deliveryDate: payload.deliveryDate, dealerName: payload.dealerName,
                  quarter: payload.quarter, team: payload.team, member: payload.member,
                  so: comp.so || '', account: comp.account || '', product: comp.product || '',
                  accType: '', priceKRW: compKRW, priceUSD: parseFloat((compKRW / (currentER || 1389)).toFixed(2)),
                  id: comp.id,
                };
                db.collection("sales").doc(comp.id).set(compPayload).catch(() => {});
                db.collection("sf_candidates").doc(comp.id).update({ used: true, usedAt: nowIso, usedBy: actor }).catch(() => {});
              });

              setConvertingCandidateId(null);
              setCompanionCandidates([]);
            }

            showToast(editingId ? (lang==='ko' ? '수정 완료 ✓' : 'Updated ✓') : (lang==='ko' ? '저장 완료 ✓' : 'Saved ✓'));
            setEditingId(null);
            setForm(initialForm);
            setShowEditModal(false);
          })
          .catch(e => showToast((lang==='ko' ? '저장 실패: ' : 'Save failed: ') + e.message, 'error'))
          .finally(() => setIsSaving(false));
      };

      const deleteSalesData = (id) => {
        if (!requireAuth()) return;
        if (window.confirm(T.confirmDelete)) {
          const targetData = rawSalesData.find(d => String(d.id) === String(id));
          db.collection("sales").doc(String(id)).delete()
            .then(() => {
              // ── Audit Log 기록 ──
              if (targetData) {
                db.collection("audit_logs").add({
                  action:    'delete',
                  actor:     (auth.currentUser?.email || ''),
                  timestamp: new Date().toISOString(),
                  member:    targetData.member,
                  team:      targetData.team,
                  quarter:   targetData.quarter,
                  account:   targetData.account,
                  before:    targetData,
                }).catch(e => showToast((lang==='ko' ? '⚠️ 감사 로그 기록 실패: ' : '⚠️ Audit log failed: ') + e.message, 'error'));
              }
              showToast(lang==='ko' ? '삭제 완료 ✓' : 'Deleted ✓');
            })
            .catch(e => showToast((lang==='ko' ? '삭제 실패: ' : 'Delete failed: ') + e.message, 'error'));
        }
      };

      const handleTargetChange  = (field, value) => { if (!requireTargetAdmin()) return; const val = value==='' ? '' : Number(value); const n = { ...quarterTargets, [selectedQuarter]: { ...quarterTargets[selectedQuarter], [field]: val } }; setQuarterTargets(n); db.collection("targets").doc("quarterTargets").set(n).catch(e => showToast((lang==='ko' ? '저장 실패: ' : 'Save failed: ') + e.message, 'error')); };
      const handleErUnlock = () => {
        if (erPwdInput === SECRET_PASSWORD) { setErUnlocked(true); setErPwdInput(''); setErPwdError(false); }
        else { setErPwdError(true); setErPwdInput(''); }
      };
      const handleErSave = () => {
        const v = parseFloat(erInputVal);
        if (!isNaN(v) && v > 0) { handleTargetChange('er', v); }
        setShowErModal(false); setErUnlocked(false); setErInputVal('');
      };
      // [FIX #분기별 개인목표] 이제 memberTargets는 { [분기]: { [멤버]: 목표값 } } 구조라서
      // selectedQuarter 아래에만 값을 써서, 다른 분기의 목표는 그대로 유지된다.
      const handleMemberTargetChange = (member, value) => { if (!requireAuth()) return; const val = value==='' ? '' : Number(value); const n = { ...memberTargets, [selectedQuarter]: { ...(memberTargets[selectedQuarter]||{}), [member]: val } }; setMemberTargets(n); db.collection("targets").doc("memberTargets").set(n); };
      const handleTeamTargetChange   = (team, quarter, value) => { if (!requireAuth()) return; const val = value==='' ? 0 : Number(value); const n = { ...teamTargets, [team]: { ...(teamTargets[team]||{}), [quarter]: val } }; setTeamTargets(n); db.collection("targets").doc("teamTargets").set(n); };
      const [showEditModal, setShowEditModal] = useState(false);
      const handleEdit = (data) => { setForm(data); setEditingId(data.id); setShowEditModal(true); };

      // 같은 SO 또는 같은 Account로 이미 등록된 sales 데이터가 있는지 확인 - 있으면 그 데이터(분기 포함) 반환
      const findExistingSalesMatch = (c) => rawSalesData.find(d =>
        (c.so && d.so === c.so) || (d.account === c.account)
      );
      const isCandidateLikelyDuplicate = (c) => !!findExistingSalesMatch(c);
      // SO가 완전히 같으면 이미 등록된 게 확실하므로 후보 목록 자체에서 제외한다 (Account만 겹치는 건 확실치 않아 경고만)
      const isAlreadyRegisteredBySO = (c) => !!(c.so && rawSalesData.some(d => d.so === c.so));
      const visibleCandidates = candidates.filter(c => !isAlreadyRegisteredBySO(c));

      // Salesforce 후보를 선택하면: 분기/팀/멤버를 후보 기준으로 맞추고, 폼에 SO/Account/Product/가격을
      // 미리 채운 뒤 편집 모달을 새 항목 작성 모드(editingId=null)로 연다. 상태/계약일/납품예정일/
      // Dealer/Acc type은 비워둬서 사람이 직접 채우도록 한다.
      const handleUseCandidate = (c) => {
        if (!requireAuth()) return;
        const existingMatch = findExistingSalesMatch(c);
        if (existingMatch) {
          const proceed = window.confirm(
            `⚠️ "${c.account}" (SO: ${c.so || '-'})는 이미 ${existingMatch.quarter} · ${existingMatch.member}에 등록되어 있습니다.\n` +
            `중복으로 저장될 수 있습니다. 계속 진행할까요?`
          );
          if (!proceed) return;
        }
        const targetQuarter = getCandidateQuarter(c);
        const targetTeam = getCandidateTeam(c);
        const targetMember = getCandidateMember(c);
        if (!quarters.includes(targetQuarter)) {
          const nq = [...quarters, targetQuarter].sort();
          setQuarters(nq);
          db.collection("settings").doc("layout").set({ quarters: nq }, { merge: true });
        }
        setShowCandidatesPage(false);
        setSelectedQuarter(targetQuarter);
        setSelectedTeam(targetTeam);
        setSelectedMember(targetMember);
        setForm({
          ...initialForm,
          so: c.so || '',
          account: c.account || '',
          product: c.product || 'GMPP',
          accType: c.accType || '',
          contractType: (c.salesType || '').toLowerCase().includes('try') ? 'Try & Buy' : '일반',
          priceKRW: c.priceKRW ? String(c.priceKRW) : '',
          priceUSD: c.priceUSD ? String(c.priceUSD) : '',
        });
        setEditingId(null);
        setConvertingCandidateId(c.id);
        setCompanionCandidates(visibleCandidates.filter(x => x.id !== c.id && x.opportunityName === c.opportunityName));
        setShowEditModal(true);
      };

      const addTeam = () => { if (!requireAuth()) return; const n = prompt(T.promptTeam); if (n && !teams[n]) { const nt = { ...teams, [n]: [] }; setTeams(nt); setSelectedTeam(n); setSelectedMember(null); db.collection("settings").doc("layout").set({ teams: nt }, { merge: true }); } };
      // teamArg가 없으면 selectedTeam을 쓴다. 통합데이터에서는 팀별로 돌면서 호출하므로
      // 팀을 넘겨야 하고, onClick={addMember} 처럼 이벤트가 첫 인자로 들어오는 기존 호출도
      // 그대로 동작해야 해서 문자열인지 확인해 구분한다.
      const teamArgOr = (teamArg) => (typeof teamArg === 'string' && teamArg ? teamArg : selectedTeam);
      const addMember = (teamArg) => { if (!requireAuth()) return; const tm = teamArgOr(teamArg); const n = prompt(`${tm}${T.promptMember}`); if (n && !(teams[tm]||[]).includes(n)) { const nt = { ...teams, [tm]: [...(teams[tm]||[]), n] }; setTeams(nt); handleMemberTargetChange(n, 0); db.collection("settings").doc("layout").set({ teams: nt }, { merge: true }); } };
      const editMemberName = (oldName, e, teamArg) => {
        if (e && e.stopPropagation) e.stopPropagation();
        if (!requireAuth()) return;
        const selectedTeam = teamArgOr(teamArg);
        const newName = prompt(T.promptRename, oldName);
        if (newName && newName !== oldName && !(teams[selectedTeam]||[]).includes(newName)) {
          const nt = { ...teams }; nt[selectedTeam] = nt[selectedTeam].map(m => m===oldName ? newName : m); setTeams(nt); db.collection("settings").doc("layout").set({ teams: nt }, { merge: true });
          const ntg = { ...memberTargets }; let ntgChanged = false;
          Object.keys(ntg).forEach(q => { if (ntg[q] && ntg[q][oldName] !== undefined) { ntg[q] = { ...ntg[q], [newName]: ntg[q][oldName] }; delete ntg[q][oldName]; ntgChanged = true; } });
          if (ntgChanged) { setMemberTargets(ntg); db.collection("targets").doc("memberTargets").set(ntg); }
          rawSalesData.filter(d => d.member===oldName).forEach(d => db.collection("sales").doc(String(d.id)).update({ member: newName }));
        }
      };
      const deleteMember = (memberName, e, teamArg) => { if (e && e.stopPropagation) e.stopPropagation(); if (!requireAuth()) return; const tm = teamArgOr(teamArg); if (!window.confirm(`'${memberName}' ${T.confirmDelMember}`)) return; const nt = { ...teams }; nt[tm] = (nt[tm]||[]).filter(m => m!==memberName); setTeams(nt); db.collection("settings").doc("layout").set({ teams: nt }, { merge: true }); };
      // ── 딜러 관리 ─────────────────────────────────────────────────────────
      const saveDealers = (next) => { setDealers(next); db.collection("settings").doc("layout").set({ dealers: next }, { merge: true }); };
      const dealerUseCount = (name) => salesData.filter(d => (d.dealerName || '') === name).length;

      const addDealer = () => {
        if (!requireDealerAdmin()) return;
        const raw = prompt(lang==='ko' ? '추가할 딜러명을 입력하세요' : 'Enter dealer name');
        const n = (raw || '').trim();
        if (!n) return;
        if (dealers.includes(n)) { alert(lang==='ko' ? '이미 있는 딜러입니다.' : 'Already exists.'); return; }
        saveDealers([...dealers, n]);
      };

      // 이름을 바꾸면 그 딜러로 저장된 매출 행의 dealerName도 같이 바꿔야 집계에서 떨어져 나가지 않는다.
      const renameDealer = (oldName) => {
        if (!requireDealerAdmin()) return;
        const raw = prompt(lang==='ko' ? '새 딜러명' : 'New dealer name', oldName);
        const n = (raw || '').trim();
        if (!n || n === oldName) return;
        if (dealers.includes(n)) { alert(lang==='ko' ? '이미 있는 딜러입니다.' : 'Already exists.'); return; }
        const used = salesData.filter(d => (d.dealerName || '') === oldName);
        if (used.length && !window.confirm(lang==='ko'
          ? `이 딜러로 등록된 매출 ${used.length}건의 딜러명도 함께 '${n}'으로 변경됩니다. 계속할까요?`
          : `${used.length} sales row(s) will also be renamed to '${n}'. Continue?`)) return;
        saveDealers(dealers.map(d => d === oldName ? n : d));
        used.forEach(row => db.collection("sales").doc(String(row.id)).update({ dealerName: n }).catch(() => {}));
      };

      // 이미 쓰인 딜러는 지우지 않는다 - 지우면 그 매출 행의 딜러명이 목록에 없는 값으로 남아
      // 드롭다운에서 선택 불가 상태가 되고, 나중에 수정할 때 조용히 빈칸으로 덮일 수 있다.
      const deleteDealer = (name) => {
        if (!requireDealerAdmin()) return;
        const used = dealerUseCount(name);
        if (used > 0) {

      const addQuarter = () => { if (!requireAuth()) return; const n = prompt(T.promptQuarter); if (!n) return; const q = normalizeQuarter(n); if (!q) { alert(lang==='ko' ? '형식이 올바르지 않습니다. 예: 2026 Q3' : 'Invalid format. e.g. 2026 Q3'); return; } if (quarters.includes(q)) return; const nq = [...quarters, q].sort(); setQuarters(nq); if (hasRole(TARGET_ADMIN_EMAILS) && !quarterTargets[q]) { const nt = { ...quarterTargets, [q]: { target: 0, gmppTarget: 0, er: currentER || 1389 } }; setQuarterTargets(nt); db.collection("targets").doc("quarterTargets").set(nt); } if (!memberTargets[q]) { const nmt = { ...memberTargets, [q]: { ...(memberTargets[selectedQuarter]||{}) } }; setMemberTargets(nmt); db.collection("targets").doc("memberTargets").set(nmt); } db.collection("settings").doc("layout").set({ quarters: nq }, { merge: true }); };

      const currentER      = quarterTargets[selectedQuarter]?.er || 1389;
      // [FIX #분기별 개인목표] 현재 선택된 분기의 멤버별 목표만 뽑아낸 값. 화면에서 목표를 "읽을 때"는

      const handleInputChange = (e) => {

      // ── [FIX #8] CSV 내보내기 — 필터 옵션 지원 ──────────────────────────

        const rows = data.map(d => [d.quarter,d.team,d.member,d.status,d.contractType,d.contractDate,d.deliveryDate,d.salesType,d.dealerName,d.so,d.account,d.product,d.accType,d.priceKRW,d.priceUSD,d.shipConfirm||'']);
        const csvContent = [headers.join(','), ...rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(','))].join('\n');

      const [showCsvMenu, setShowCsvMenu] = useState(false);
      const [showCandidatesPage, setShowCandidatesPage] = useState(false);
      const [showTeamOnly, setShowTeamOnly] = useState(false);
      // 통합데이터가 기본(그리고 유일한) 전체 화면. 대시보드/팀별 대시보드는 통합데이터로 합쳐졌다.
      const [showAllTeamsCombined, setShowAllTeamsCombined] = useState(true);
      const [allTeamsViewMode, setAllTeamsViewMode] = useState('team'); // 'team' | 'dealer'

      // 통합데이터로 옮겨왔지만 평소 화면이 지저분해지지 않게 이 토글을 켤 때만 노출한다.
      const [combinedEditMode, setCombinedEditMode] = useState(false);
      // 외부 커미션(ext. commission) - SO별 수수료(부가세 별도). commissions.json은 재무 엑셀에서 추출한 참조 데이터.
      const [commissions, setCommissions] = useState({});

      const toggleCandidatesFilterOpen = (col) => { setCandidatesFilterOpen(k => k === col ? null : col); setCandidatesFilterSearchQuery(''); };
      const [showMemberCandidateSearch, setShowMemberCandidateSearch] = useState(false);
      const [memberCandidateSearchQuery, setMemberCandidateSearchQuery] = useState('');

      const [candidateOverrides, setCandidateOverrides] = useState({});

      const moveCard = (idx, dir) => { const next = [...cardOrder]; const to = idx + dir; if (to < 0 || to >= next.length) return; [next[idx], next[to]] = [next[to], next[idx]]; setCardOrder(next); safeLS.set(CARD_ORDER_KEY, JSON.stringify(next)); };
      const [dragOverIdx, setDragOverIdx] = useState(null);

      const handleDragOver  = (e, idx) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; setDragOverIdx(idx); };
      const handleDrop      = (e, toIdx) => { e.preventDefault(); const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10); if (fromIdx === toIdx) { setDragOverIdx(null); return; } const next = [...cardOrder]; const [moved] = next.splice(fromIdx, 1); next.splice(toIdx, 0, moved); setCardOrder(next); safeLS.set(CARD_ORDER_KEY, JSON.stringify(next)); setDragOverIdx(null); };

      // ── 멤버 상세 테이블(Ship Confirm/ACT/Pending/Backup) 열 필터 (Excel 자동 필터 방식) ──
      const [memberTableFilters, setMemberTableFilters] = useState({});
      const [memberTableFilterOpen, setMemberTableFilterOpen] = useState(null);
      const DEFAULT_MEMBER_FILTER = { status:[], contractType:[], dealer:[], account:[], product:[], accType:[] };
      const getMemberFilter = (tableKey) => memberTableFilters[tableKey] || DEFAULT_MEMBER_FILTER;
      const toggleMemberTableFilter = (tableKey, col, val) => setMemberTableFilters(prev => { const cur = prev[tableKey] || DEFAULT_MEMBER_FILTER; const arr = cur[col]||[]; return { ...prev, [tableKey]: { ...cur, [col]: arr.includes(val) ? arr.filter(v=>v!==val) : [...arr, val] } }; });
      const clearMemberTableFilter  = (tableKey, col) => setMemberTableFilters(prev => ({ ...prev, [tableKey]: { ...(prev[tableKey] || DEFAULT_MEMBER_FILTER), [col]: [] } }));
      const clearMemberTableFilters = (tableKey) => setMemberTableFilters(prev => ({ ...prev, [tableKey]: { status:[], contractType:[], dealer:[], account:[], product:[], accType:[] } }));
      const applyMemberTableFilter  = (tableKey, rawRows) => {
        const f = getMemberFilter(tableKey);
        return rawRows.filter(r =>
          (f.status.length===0       || f.status.includes(r.status)) &&
          (f.contractType.length===0 || f.contractType.includes(r.contractType||'일반')) &&
          (f.dealer.length===0       || f.dealer.includes(r.dealerName||'-')) &&

          (f.product.length===0      || f.product.includes(r.product)) &&

        );
      };

      const [rowOrders, setRowOrders]   = useState({ ShipConfirm:{}, ACT:{}, Pending:{}, Backup:{}, Minal:{} });
      const [rowDragState, setRowDragState] = useState({ type:null, fromId:null, overId:null });

      useEffect(() => {
        if (!currentUser) return;
        const unsub = db.collection("settings").doc("rowOrders").onSnapshot(doc => { if (doc.exists) { const d = doc.data(); if (d && typeof d === 'object') setRowOrders(d); } });
        return () => unsub();
      }, [currentUser]);

      const saveRowOrders = (next) => { if (!auth.currentUser) { setShowLoginModal(true); return; } setRowOrders(next); db.collection("settings").doc("rowOrders").set(next); };
      const getOrderedRows = (status, rawRows) => {
        const key = `${selectedQuarter}__${selectedMember}__${status}`;
        const orderMap = rowOrders[status]?.[key];
        if (!orderMap || !Array.isArray(orderMap) || orderMap.length === 0) return rawRows;
        const mapped = {}; rawRows.forEach(r => { mapped[String(r.id)] = r; });
        const ordered = orderMap.map(id => mapped[id]).filter(Boolean);
        const rest = rawRows.filter(r => !orderMap.includes(String(r.id)));
        return [...ordered, ...rest];
      };
      const handleRowDragStart = (e, status, rowId) => { e.dataTransfer.effectAllowed='move'; setRowDragState({ type:status, fromId:String(rowId), overId:null }); };
      const handleRowDragOver  = (e, status, rowId) => { e.preventDefault(); if (rowDragState.type!==status) return; setRowDragState(s => ({ ...s, overId:String(rowId) })); };
      const handleRowDrop      = (e, status, toRowId, rawRows) => {
        e.preventDefault();
        const { fromId } = rowDragState; const toId = String(toRowId);
        if (!fromId || fromId===toId) { setRowDragState({ type:null, fromId:null, overId:null }); return; }
        const key = `${selectedQuarter}__${selectedMember}__${status}`;
        const rawOrder = rowOrders[status]?.[key];
        // 저장된 순서를 현재 행 목록과 맞춰준다. 순서를 저장한 뒤에 새로 추가된 행은
        // 저장값에 없어서 화면 맨 아래에 붙는데, 예전에는 그 행들의 indexOf가 -1이라
        // 드래그가 조용히 무시됐다(맨 아래 행만 순서가 안 바뀌던 원인).
        // 삭제된 행의 id도 여기서 같이 걸러진다.
        const ids   = rawRows.map(r => String(r.id));
        const saved = (Array.isArray(rawOrder) ? rawOrder : []).filter(id => ids.includes(id));
        const currentOrder = [...saved, ...ids.filter(id => !saved.includes(id))];
        const fi = currentOrder.indexOf(fromId); const ti = currentOrder.indexOf(toId);
        if (fi===-1 || ti===-1) { setRowDragState({ type:null, fromId:null, overId:null }); return; }
        const next = [...currentOrder]; next.splice(fi, 1); next.splice(ti, 0, fromId);
        saveRowOrders({ ...rowOrders, [status]: { ...(rowOrders[status]||{}), [key]: next } });
        setRowDragState({ type:null, fromId:null, overId:null });
      };
      const handleRowDragEnd = () => setRowDragState({ type:null, fromId:null, overId:null });

      // ── 행 강조색 (팀 공유) ────────────────────────────────────────────────
      // sales 문서를 건드리지 않고 settings/rowColors 에 { [rowId]: palette } 로 따로 둔다.
      // rowOrders와 같은 방식 - 매출 데이터와 표시용 설정을 섞지 않으려는 것.
      const ROW_HILITE = {
        yellow: { label:'노랑', bg:'#fef9c3', border:'#fde047' },
        green:  { label:'초록', bg:'#dcfce7', border:'#86efac' },
        blue:   { label:'파랑', bg:'#dbeafe', border:'#93c5fd' },
        pink:   { label:'분홍', bg:'#fce7f3', border:'#f9a8d4' },
        orange: { label:'주황', bg:'#ffedd5', border:'#fdba74' },
        purple: { label:'보라', bg:'#ede9fe', border:'#c4b5fd' },
        gray:   { label:'회색', bg:'#e2e8f0', border:'#cbd5e1' },
      };
      const [rowColors, setRowColors] = useState({});
      useEffect(() => {
        if (!currentUser) return;
        const unsub = db.collection("settings").doc("rowColors").onSnapshot(doc => {
          const d = doc.exists ? doc.data() : null;
          setRowColors(d && typeof d === 'object' ? d : {});
        }, () => {});
        return () => unsub();
      }, [currentUser]);

      // 색 선택 대상 행들 (통합데이터에서 클릭으로 모음). 저장 후에도 선택은 유지 - 색을 연달아 바꿔볼 수 있게.

      const togglePickedRow = (rowId) => setPickedRowIds(prev => {
        const id = String(rowId);
        return prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id];
      });
      const clearPickedRows = () => setPickedRowIds([]);

      const applyRowColor = (palette) => {
        if (!auth.currentUser) { setShowLoginModal(true); return; }
        if (pickedRowIds.length === 0) { showToast('먼저 색을 넣을 행을 클릭해서 고르세요', 'error'); return; }
        const next = { ...rowColors };

        db.collection("settings").doc("rowColors").set(next)
          .then(() => showToast(palette ? `${pickedRowIds.length}건 ${ROW_HILITE[palette].label}으로 표시` : `${pickedRowIds.length}건 색 해제`))
          .catch(() => showToast('색상 저장 실패', 'error'));

      const [scenarioDrag, setScenarioDrag] = useState({ rowId:null, overKey:null });
      const teamOfMember = (m) => Object.keys(teams).find(t => (Array.isArray(teams[t]) ? teams[t] : []).includes(m)) || null;

      // 아직 반영되지 않을 수 있는데, 그때 드롭을 놓치면 "끌었는데 아무 일도 안 생김"이 된다.
      const scenarioDragIdRef = useRef(null);

        e.preventDefault(); e.dataTransfer.dropEffect = 'move';

      //
      // 두 가지를 일부러 지킨다:
      //  1) 이 줄보다 위에서는 rawSalesData만 쓴다 - Firestore 쓰기(분기 이월, 멤버 이름변경),
      //     감사 로그의 before 스냅샷, 중복 등록 검사, CSV 추출이 가상 이동에 오염되면 안 된다.
      //  2) 담당자 상세/개인별 화면에서는 오버레이를 끈다 - 거기가 실제 Ship Confirm·ACT를
      //     확정하는 자리라, 가상으로 옮긴 건이 진짜처럼 보이면 위험하다.
      const scenarioActive = scenarioCount > 0 && !selectedMember && !showMemberPicker;
      const salesData = useMemo(() => {
        if (!scenarioActive) return rawSalesData;
        return rawSalesData.map(d => {
          const patch = scenarioMoves[String(d.id)];
          return patch ? { ...d, ...patch, _scenarioMoved: true } : d;
        });
      }, [rawSalesData, scenarioMoves, scenarioActive]);

      const currentQData   = salesData.filter(d => d.quarter === selectedQuarter);
      const currentTargets = quarterTargets[selectedQuarter] || { target: 0, gmppTarget: 0, er: 1389 };
      const targetKRW      = currentTargets.target || 0;
      const gmppTargetKRW  = currentTargets.gmppTarget || 0;
      const activeER       = currentTargets.er || 1389;
      const targetUSD      = targetKRW / activeER;
      const incentiveTargetKRW = targetKRW / 1.2;
      const incentiveTargetUSD = targetUSD / 1.2;

      // ★ 핵심: ACT + Pending 만 집계
      const expectedData   = currentQData.filter(d => isRevenue(d));
      const expectedKRW    = expectedData.reduce((s, d) => s + (d.priceKRW || 0), 0);
      const expectedUSD    = expectedKRW / activeER;
      const percent        = targetKRW ? (expectedKRW / targetKRW) * 100 : 0;
      const gapKRW         = targetKRW - expectedKRW;
      const gmppExpectedKRW = expectedData.filter(d => d.product==='GMPP').reduce((s, d) => s + (d.priceKRW||0), 0);
      const gmppGapKRW      = gmppTargetKRW - gmppExpectedKRW;
      const gmppTargetUSD   = gmppTargetKRW / activeER;
      const gapUSD          = gapKRW / activeER;
      const gmppGapUSD      = gmppGapKRW / activeER;
      const gmppExpectedUSD = gmppExpectedKRW / activeER;

      // ★ 누적 달성치 = status === 'Ship Confirm' 인 것만 (Target 대비 매출 기준)
      const shipConfirmData  = currentQData.filter(d => d.status === 'Ship Confirm');
      const shipConfirmKRW   = shipConfirmData.reduce((s, d) => s + (d.priceKRW || 0), 0);
      const shipConfirmUSD   = shipConfirmKRW / activeER;
      const shipConfirmCount = shipConfirmData.length;
      const shipConfirmPct   = targetKRW ? (shipConfirmKRW / targetKRW) * 100 : 0;
      const actData          = currentQData.filter(d => d.status === 'ACT');
      const actKRW           = actData.reduce((s, d) => s + (d.priceKRW || 0), 0);
      const actUSD           = actKRW / activeER;
      const actPct           = targetKRW ? (actKRW / targetKRW) * 100 : 0;

      const memberActFcstData = selectedMember ? expectedData.filter(d => d.member===selectedMember) : [];
      const memberACT         = memberActFcstData.reduce((s, d) => s + (d.priceKRW||0), 0);
      // 개인 Ship Confirm 달성치 (Target 대비)
      const memberSCData      = selectedMember ? currentQData.filter(d => d.member===selectedMember && d.status==='Ship Confirm') : [];
      const memberActData     = selectedMember ? currentQData.filter(d => d.member===selectedMember && d.status==='ACT') : [];
      const memberActKRW      = memberActData.reduce((s, d) => s + (d.priceKRW||0), 0);
      const memberSCKRW       = memberSCData.reduce((s, d) => s + (d.priceKRW||0), 0);

      // SC 기준 집계 데이터
      const scData = currentQData.filter(d => d.status === 'Ship Confirm');

      const allProducts = ['GMPP','Picoway','Cryo7','VBP','Hand Piece','Nordlys','Nordlys Mini','GMP'];
      const productStats = {};
      allProducts.forEach(p => productStats[p] = { count:0, sumKRW:0 });
      scData.forEach(cur => { if (productStats[cur.product]) { productStats[cur.product].count += 1; productStats[cur.product].sumKRW += (cur.priceKRW||0); }});

      // 실적이 있는 딜러만 집계에 넣는다. 예전엔 딜러 목록 전체를 0원으로 미리 깔아둬서
      // 거래 없는 딜러가 ₩0으로 줄줄이 나왔는데, 딜러가 15개로 늘면서 목록만 길어졌다.
      const dealerStats = {};
      scData.forEach(cur => {
        const dealer = cur.dealerName || '기타';
        if (!dealerStats[dealer]) dealerStats[dealer] = { count:0, sumKRW:0 };
        dealerStats[dealer].count += 1;
        dealerStats[dealer].sumKRW += (cur.priceKRW||0);
      });

      // 주어진 매출 행들에 걸린 외부 커미션 합계.
      // 커미션은 계약(SO) 단위로 한 번 지급되는데 대시보드는 같은 SO를 GMPP/Cryo7 등 여러 줄로
      // 쪼개서 들고 있으므로, SO를 중복 제거하고 SO당 한 번만 더해야 이중 차감이 안 된다.
      // SO가 비어있는 행은 매칭 자체가 불가능하므로 그냥 0원 취급(= 커미션 없는 것으로 표시).
      // 커미션은 계약(SO) 단위로 한 번 지급되는데 대시보드는 한 계약을 GMPP/Cryo7 등 여러 줄로
      // 쪼개 갖고 있다. 커미션은 주력 장비(GMPP) 판매에 대해 나가는 것이고 Cryo7 등은 딸려간
      // 구성품이므로, 금액 비율로 안분하지 않고 GMPP 줄에서 전액 차감한다
      // (GMPP가 없는 계약이면 금액이 가장 큰 줄). 합계는 어느 줄에 붙이든 같다.
      const commissionBearerId = {};
      {
        const bySo = {};
        salesData.forEach(d => {
          if (!isRevenue(d)) return;
          const so = String(d.so || '').trim();
          if (!so || !commissions[so]) return;
          (bySo[so] = bySo[so] || []).push(d);
        });
        Object.keys(bySo).forEach(so => {
          const best = bySo[so].slice().sort((a, b) => {
            const ag = a.product === 'GMPP' ? 0 : 1, bg = b.product === 'GMPP' ? 0 : 1;
            if (ag !== bg) return ag - bg;
            return (b.priceKRW || 0) - (a.priceKRW || 0);
          })[0];
          commissionBearerId[so] = best.id;
        });
      }

      // 실제로 이 행에서 빠지는 커미션 (계약당 대표 줄 하나만 부담)
      const rowCommission = (row) => {
        if (!applyCommission || !isRevenue(row)) return 0;
        const so = String(row.so || '').trim();
        if (!so) return 0;
        return commissionBearerId[so] === row.id ? (commissions[so] || 0) : 0;
      };

      // 색 표기용 - 차감을 지지 않는 같은 계약의 다른 줄(Cryo7 등)도 빨갛게 보여준다
      const inCommissionContract = (row) => {
        if (!applyCommission || !isRevenue(row)) return 0;
        const so = String(row.so || '').trim();
        return so ? (commissions[so] || 0) : 0;
      };

      // 한 계약(같은 병원/SO)의 GMPP·Cryo7 줄이 목록에서 흩어지지 않고 붙어 나오도록.
      // Firestore 반환 순서 그대로 뿌리면 같은 계약이 멀찍이 떨어져 커미션 차감분을 대조하기 어렵다.
      const sortByContract = (a, b) => {
        const ax = (a.account || ''), bx = (b.account || '');
        if (ax !== bx) return ax.localeCompare(bx, 'ko');
        const as = String(a.so || ''), bs = String(b.so || '');
        if (as !== bs) return as.localeCompare(bs);
        return (a.product || '').localeCompare(b.product || '');
      };

      // 화면 표기용 - 커미션 차감 후 금액
      const netPrice = (row) => Math.round((row.priceKRW || 0) - rowCommission(row));
      const commissionFor = (rows) => Math.round(rows.reduce((s, r) => s + rowCommission(r), 0));

      // ── 클릭으로 고른 건들의 소계 ────────────────────────────────────────────
      // "이 건들만 잡으면 얼마가 되고 목표의 몇 %인가"를 바로 보려는 용도.
      // 색칠 대상과 같은 선택을 쓴다(행 한 번 클릭 = 고르기).
      const pickedRowsInQ = currentQData.filter(d => pickedRowIds.includes(String(d.id)));
      const pickedSumKRW  = pickedRowsInQ.reduce((s,d) => s + netPrice(d), 0);
      const pickedTargetPct   = targetKRW  ? (pickedSumKRW / targetKRW) * 100 : 0;
      const pickedExpectedPct = expectedKRW ? (pickedSumKRW / expectedKRW) * 100 : 0;

      const allMembers = Object.values(teams).flat();
      const memberStats = {}; allMembers.forEach(m => memberStats[m] = { count:0, sumKRW:0, actCount:0, actKRW:0 });
      // 달성률 집계: sumKRW = Ship Confirm 기준(기존), actKRW = ACT 기준.
      // 합계 달성률(SC+ACT vs Target)은 두 값을 더해서 계산한다.
      scData.forEach(cur => { const mem = cur.member; if (memberStats[mem]) { memberStats[mem].count += 1; memberStats[mem].sumKRW += (cur.priceKRW||0); }});
      actData.forEach(cur => { const mem = cur.member; if (memberStats[mem]) { memberStats[mem].actCount += 1; memberStats[mem].actKRW += (cur.priceKRW||0); }});

      // ── 렌더 헬퍼 ─────────────────────────────────────────────────────────
      const renderProgressBar = (scAmt, actAmt, tgtKRW, er) => {
        if (!tgtKRW) return null;
        const usedER = er || activeER || 1389;
        const target120 = tgtKRW * 1.2; const target150 = tgtKRW * 1.5;
        const maxScale = Math.max(target150, scAmt + actAmt);
        const scPer  = (scAmt / tgtKRW) * 100;
        const actPer = (actAmt / tgtKRW) * 100;
        const totalPer = scPer + actPer;
        const scW  = (scAmt / maxScale) * 100;
        const actW = (actAmt / maxScale) * 100;
        // ── 3-zone ascending achievement family (zone1 slate <100%, zone2 blue 100-120%, zone3 emerald 120%+) ──
        const zone1W = (tgtKRW/maxScale)*100;
        const zone2W = (target120/maxScale)*100 - zone1W;
        const zone3W = 100 - zone1W - zone2W;
        const markerPos = Math.min((scAmt+actAmt)/maxScale*100, 100);
        const totalZone = totalPer>=120?3:totalPer>=100?2:1;
        const totalColor = totalZone===3?'#047857':totalZone===2?'#1d4ed8':'#475569';
        return (
          <div className="w-full mt-6 md:mt-8" data-region="achievement-bar">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 md:mb-8 relative">
              <div className="mb-2 md:mb-0 flex flex-wrap gap-2 items-center">
                <span className="toss-tnum text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">SC: ₩ {scAmt.toLocaleString()}</span>
                <span className="toss-tnum text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">ACT: ₩ {actAmt.toLocaleString()}</span>
              </div>
              <span className="toss-tnum text-lg font-extrabold" style={{color:totalColor}}>{lang==='ko'?'합계 달성률':'Total'}: {totalPer.toFixed(1)}% <span className="text-sm font-bold">(₩ {(scAmt+actAmt).toLocaleString()})</span></span>
              <div className="block absolute w-full -bottom-6 left-0 h-5">
                <div className="toss-tnum absolute -translate-x-1/2 text-xs font-bold" style={{ left:`${(tgtKRW/maxScale)*100}%`, color:'#475569' }}>100%</div>
                <div className="toss-tnum absolute -translate-x-1/2 text-xs font-bold" style={{ left:`${(target120/maxScale)*100}%`, color:'#1d4ed8' }}>120%</div>
                <div className="toss-tnum absolute -translate-x-1/2 text-xs font-bold" style={{ left:`${(target150/maxScale)*100}%`, color:'#047857' }}>150%</div>
              </div>
            </div>
            <div className="relative w-full h-6 md:h-8 rounded-full overflow-hidden border border-gray-200" style={{display:'flex'}}>
              {/* ascending zone track (context, sits behind the actual SC/ACT fills) */}
              <div className="absolute inset-0" style={{display:'flex'}} aria-hidden="true">
                <div style={{width:`${Math.max(zone1W,0)}%`,background:'#f1f5f9'}}></div>
                <div style={{width:`${Math.max(zone2W,0)}%`,background:'#eff6ff'}}></div>
                <div style={{width:`${Math.max(zone3W,0)}%`,background:'#ecfdf5'}}></div>
              </div>
              <div className="h-full transition-all duration-1000 ease-out flex items-center justify-end pr-1 text-white font-bold text-xs bg-blue-500 relative" style={{ width:`${scW}%`, overflow:'hidden' }}>
                {/* Desktop keeps the original achievement-based threshold (track is wide enough that it always fit).
                    Mobile switches to the visual fill-width (scW), which is what actually determines whether the
                    label physically has room in its own segment at a narrow track — the two percentages diverge
                    because the track is scaled to 150% while the achievement % is relative to the 100% target. */}
                <span className="toss-tnum hidden md:inline">{scPer > 4 && `${scPer.toFixed(1)}%`}</span>
                <span className="toss-tnum md:hidden">{scW > 8 && `${scPer.toFixed(1)}%`}</span>
              </div>
              <div className="h-full transition-all duration-1000 ease-out flex items-center justify-end pr-1 text-white font-bold text-xs bg-emerald-500 relative" style={{ width:`${actW}%`, overflow:'hidden' }}>
                {/* 초록 구간 끝 = SC+ACT 누적 지점이라, ACT 단독이 아니라 합계 달성률을 찍는다 */}
                <span className="toss-tnum hidden md:inline">{actPer > 4 && `${totalPer.toFixed(1)}%`}</span>
                <span className="toss-tnum md:hidden">{actW > 8 && `${totalPer.toFixed(1)}%`}</span>
              </div>
              <div className="absolute top-0 bottom-0 border-l-2 border-dashed" style={{ left:`${(tgtKRW/maxScale)*100}%`, borderColor:'#94a3b8' }}></div>
              <div className="absolute top-0 bottom-0 border-l-2 border-dashed" style={{ left:`${(target120/maxScale)*100}%`, borderColor:'#93c5fd' }}></div>
              <div className="absolute top-0 bottom-0 border-l-2 border-dashed" style={{ left:`${(target150/maxScale)*100}%`, borderColor:'#6ee7b7' }}></div>
              {/* current-value position marker pin (TREMOR-CATEGORYBAR anatomy) */}
              <div className="absolute top-0 bottom-0" style={{ left:`${markerPos}%`, width:'2px', background:'#1e293b', boxShadow:'0 0 0 1px rgba(255,255,255,0.6)' }} title={lang==='ko'?`현재 위치: ${totalPer.toFixed(1)}%`:`Current: ${totalPer.toFixed(1)}%`}></div>
            </div>
            <div className="flex gap-4 mt-2 text-xs">
              <span className="flex items-center gap-1"><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'2px',background:'#3b82f6'}}></span>{lang==='ko'?'SC (Ship Confirm)':'SC'}</span>
              <span className="flex items-center gap-1"><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'2px',background:'#10b981'}}></span>{lang==='ko'?'ACT (납품완료)':'ACT'}</span>
            </div>
          </div>
        );
      };

      // renderProgressBar를 좁은 카드에 넣을 때 쓰는 축약판 - 100/120/150% 축 표시 없이
      // 목표 대비 현재(SC+ACT, 비율 유지)만 한 줄 바로 보여준다.
      // hideTotal: 상단 대시보드처럼 패널 제목에 이미 합계가 찍히는 곳에서 중복을 없애기 위해 씀
      const renderSimpleProgressBar = (scAmt, actAmt, tgtKRW, showIncentive, hideTotal) => {
        if (!tgtKRW) return null;
        const totalAmt = scAmt + actAmt;
        const scale = Math.max(tgtKRW, totalAmt, 1);
        const scPer = (scAmt/tgtKRW)*100;
        const actPer = (actAmt/tgtKRW)*100;
        const totalPer = scPer + actPer;
        const scW = scAmt/scale*100;
        const actW = actAmt/scale*100;
        const totalColor = totalPer>=120?'#047857':totalPer>=100?'#1d4ed8':'#475569';
        const incentiveTarget = tgtKRW/1.2;
        return (
          <div style={{marginBottom:'8px'}}>
            <div className="flex justify-between items-start mb-1 gap-3">
              <span className="text-[11px] font-bold text-gray-500 whitespace-nowrap">목표 ₩{tgtKRW.toLocaleString()}</span>
              <div className="flex flex-col items-end leading-tight">
                {!hideTotal && <span className="text-[11px] font-extrabold" style={{color:totalColor}}>합계 ₩{totalAmt.toLocaleString()} ({totalPer.toFixed(1)}%)</span>}
                <span className="text-[10px] font-bold" style={{color:'#1d4ed8'}}>SC ₩{scAmt.toLocaleString()} ({scPer.toFixed(1)}%)</span>
                <span className="text-[10px] font-bold" style={{color:'#047857'}}>ACT ₩{actAmt.toLocaleString()}</span>
              </div>
            </div>
            <div className="relative w-full" style={{height:'14px'}}>
              {showIncentive && <span className="absolute -translate-x-1/2 text-[10px] font-bold" style={{left:`${incentiveTarget/scale*100}%`, color:'#7c3aed'}}>Incentive</span>}
              <span className="absolute -translate-x-1/2 text-[10px] font-bold" style={{left:`${Math.min(tgtKRW/scale*100,98)}%`, color:'#1e293b'}}>Target</span>
            </div>
            <div className="relative w-full rounded-full overflow-hidden bg-gray-100" style={{height:'18px', display:'flex'}}>
              <div className="h-full flex items-center justify-end text-white font-bold" style={{width:`${scW}%`, background:'#3b82f6', fontSize:'10px', paddingRight:'5px', overflow:'hidden'}}>{scW>10 && `${scPer.toFixed(1)}%`}</div>
              {/* 초록 구간 끝 = SC+ACT 누적 지점이라 합계 달성률을 찍는다 */}
              <div className="h-full flex items-center justify-end text-white font-bold" style={{width:`${actW}%`, background:'#10b981', fontSize:'10px', paddingRight:'5px', overflow:'hidden'}}>{actW>10 && `${totalPer.toFixed(1)}%`}</div>
              {showIncentive && <div className="absolute top-0 bottom-0 border-l-2 border-dashed" style={{left:`${incentiveTarget/scale*100}%`, borderColor:'#c4b5fd'}} title={`Incentive Target ₩${incentiveTarget.toLocaleString()}`}></div>}
              <div className="absolute top-0 bottom-0 border-l-2 border-dashed" style={{left:`${Math.min(tgtKRW/scale*100,99.5)}%`, borderColor:'#1e293b'}} title={`목표 ₩${tgtKRW.toLocaleString()}`}></div>
            </div>
          </div>
        );
      };

      const renderBarChart = (dataObj, colorClass) => {
        const dataArr = Object.entries(dataObj).sort((a,b) => b[1].sumKRW - a[1].sumKRW);
        const maxVal  = Math.max(...dataArr.map(d => d[1].sumKRW), 1);
        return (
          <div className="space-y-4">
            {dataArr.map(([key, stat]) => {
              const per = maxVal === 0 ? 0 : (stat.sumKRW / maxVal) * 100;
              return (
                <div key={key} className="flex flex-col">
                  <div className="flex justify-between items-end mb-1 text-xs md:text-sm">
                    <span className="font-bold text-gray-800">{key} <span className="text-gray-400 font-normal ml-1">({stat.count}{T.cases})</span></span>
                    <span className="font-mono font-bold text-gray-700 text-[13px] md:text-[15px]">₩ {stat.sumKRW.toLocaleString()}</span>
                  </div>
                  <div className="w-full bg-gray-100 h-2 md:h-3 rounded-full overflow-hidden shadow-inner flex"><div className={`${colorClass} h-full rounded-full transition-all duration-1000`} style={{ width:`${per}%` }}></div></div>
                </div>
              );
            })}
          </div>
        );
      };

      // 담당자별 달성률: SC(파랑) 위에 ACT(초록)를 쌓아 "SC 달성률"과 "SC+ACT 합계 달성률"을
      // 한 막대에서 같이 읽게 한다. 스케일은 개인 목표(100%) 기준이고, 합계가 목표를 넘으면
      // 초과분이 보이도록 스케일을 자동으로 늘리고 100% 지점에 점선을 세운다.
      const renderMemberChart = (dataObj, targetsObj) => {
        const grand   = (s) => (s.sumKRW || 0) + (s.actKRW || 0);
        const dataArr = Object.entries(dataObj).sort((a,b) => grand(b[1]) - grand(a[1]));
        return (
          <div className="space-y-5">
            {dataArr.map(([key, stat]) => {
              const target   = targetsObj[key] || 0;
              const scKRW    = stat.sumKRW || 0;
              const mActKRW  = stat.actKRW || 0;
              const totalKRW = scKRW + mActKRW;
              const scPer    = target === 0 ? 0 : (scKRW / target) * 100;
              const mActPer  = target === 0 ? 0 : (mActKRW / target) * 100;
              const totalPer = scPer + mActPer;
              const scaleMax = target > 0 ? Math.max(target, totalKRW) : 0;
              const scW      = scaleMax > 0 ? (scKRW / scaleMax) * 100 : 0;
              const actW     = scaleMax > 0 ? (mActKRW / scaleMax) * 100 : 0;
              const targetW  = scaleMax > 0 ? (target / scaleMax) * 100 : 0;
              // 헤더/팀 막대와 같은 3단계 상승형 색 체계
              const totalColor = totalPer >= 120 ? '#047857' : totalPer >= 100 ? '#1d4ed8' : '#475569';
              return (
                <div key={key} className="flex flex-col">
                  <div className="flex justify-between items-end mb-1 text-xs md:text-sm">
                    <span className="font-bold text-gray-800">{key} <span className="text-gray-400 font-normal ml-1">(SC {stat.count}{T.cases} · ACT {stat.actCount||0}{T.cases})</span></span>
                    <div className="text-right flex flex-col">
                      <span className="font-mono font-bold text-gray-800 text-[13px] md:text-[15px]">₩ {totalKRW.toLocaleString()} {target > 0 && <span className="text-[10px] md:text-[12px] ml-1 font-extrabold" style={{color:totalColor}}>({totalPer.toFixed(1)}%)</span>}</span>
                      {target > 0 && <span className="font-mono text-gray-400 text-[9px] md:text-[10px]">Target: ₩ {target.toLocaleString()}</span>}
                    </div>
                  </div>
                  <div className="relative w-full bg-gray-100 h-2 md:h-3 rounded-full overflow-hidden shadow-inner flex">
                    <div className="h-full transition-all duration-1000" style={{ width:`${scW}%`, background:'#3b82f6' }}></div>
                    <div className="h-full transition-all duration-1000" style={{ width:`${actW}%`, background:'#10b981' }}></div>
                    {target > 0 && totalKRW > target && <div className="absolute top-0 bottom-0 border-l-2 border-dashed" style={{ left:`${targetW}%`, borderColor:'#94a3b8' }}></div>}
                  </div>
                  {target > 0 && (
                    <div className="flex flex-wrap items-center gap-x-4 gap-y-1 mt-1.5 text-[11px] md:text-[12px] font-bold">
                      {/* ① SC 대비 타겟 달성률 */}
                      <span className="flex items-center gap-1" style={{color:'#1d4ed8'}}><span style={{display:'inline-block',width:'8px',height:'8px',borderRadius:'2px',background:'#3b82f6'}}></span>{lang==='ko'?'SC 달성률':'SC vs Target'} <span className="font-extrabold text-[13px]">{scPer.toFixed(1)}%</span></span>
                      {/* ② SC+ACT 합계 대비 타겟 달성률 */}
                      <span className="flex items-center gap-1" style={{color:totalColor}}><span style={{display:'inline-block',width:'8px',height:'8px',borderRadius:'2px',background:'#10b981'}}></span>{lang==='ko'?'SC+ACT 합계':'SC+ACT Total'} <span className="font-extrabold text-[13px]">{totalPer.toFixed(1)}%</span></span>
                      <span className="ml-auto font-normal text-gray-400">ACT {mActPer.toFixed(1)}%</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      };

      // ── 통합데이터 오른쪽 요약 패널 ─────────────────────────────────────────
      // 옛 대시보드의 "분기 요약 지표" KPI 카드 9개를, 엑셀 납품처 FCST 시트의
      // 세로 라벨|값 격자 모양으로만 바꿔 옮긴 것. 값·산식은 카드와 동일하다.
      //  · 순서는 cardOrder(대시보드에서 저장해둔 카드 순서)를 그대로 따른다.
      //  · 커미션 토글이 꺼져 있으면(기본) rowCommission이 0이라 카드 값과 정확히 일치하고,
      //    켜면 화면 상단 총액과 어긋나지 않도록 커미션을 뺀 금액으로 보여준다.
      const renderFcstSummaryPanel = () => {
        const revRows   = currentQData.filter(isRevenue);
        const pExpected = revRows.reduce((s,d)=>s+(d.priceKRW||0),0) - commissionFor(revRows);
        const pGap      = targetKRW - pExpected;
        const pGmppRows = revRows.filter(d => d.product==='GMPP');
        const pGmppExp  = pGmppRows.reduce((s,d)=>s+(d.priceKRW||0),0) - commissionFor(pGmppRows);
        const pGmppGap  = gmppTargetKRW - pGmppExp;
        const pGmppPct  = gmppTargetKRW ? (pGmppExp / gmppTargetKRW) * 100 : 0;
        const pActRows  = currentQData.filter(isACT);
        const pAct      = pActRows.reduce((s,d)=>s+(d.priceKRW||0),0) - commissionFor(pActRows);
        const pScRows   = currentQData.filter(isShipConfirm);
        const pSc       = pScRows.reduce((s,d)=>s+(d.priceKRW||0),0) - commissionFor(pScRows);
        const pIncentivePct = incentiveTargetKRW ? (pExpected / incentiveTargetKRW) * 100 : 0;

        const won = (n) => '₩ ' + Math.round(n).toLocaleString();
        const usd = (n) => '$ ' + Math.round(n / activeER).toLocaleString();

        const L = { padding:'5px 6px', border:'1px solid #cbd5e1', fontSize:'11px', fontWeight:'700', color:'#334155', background:'#f1f5f9', whiteSpace:'nowrap' };
        const V = { padding:'5px 6px', border:'1px solid #cbd5e1', fontSize:'11px', fontWeight:'700', textAlign:'right', fontFamily:'monospace' };

        // 카드 하나 = 한 행. note는 카드에 붙어있던 배지(vs Target %, 초과/미달)를 옮긴 것.
        const Row = ({ label, value, sub, note, noteAhead, labelStyle, valueStyle, editable, onEdit, editColor }) => (
          <tr>
            <td style={{...L, ...(labelStyle||{})}}>
              {label}{editable && <span style={{marginLeft:'3px', opacity:0.7}}>✏️</span>}
            </td>
            <td style={{...V, ...(valueStyle||{})}}>
              {editable && !summaryLocked
                ? <input type="number" min="0" value={value===0?'':value} onChange={e=>onEdit(e.target.value)}
                    style={{width:'100%', textAlign:'right', fontFamily:'monospace', fontSize:'11px', fontWeight:'700', color:editColor||'#1e293b', border:'none', borderBottom:`1px solid ${editColor||'#cbd5e1'}`, outline:'none', background:'transparent'}}/>
                : <div style={{whiteSpace:'nowrap'}}>{won(value)}</div>}
              <div style={{display:'flex', justifyContent:'space-between', gap:'4px', fontSize:'9px', fontWeight:'700', marginTop:'1px'}}>
                {note
                  ? <span style={{color: noteAhead ? '#047857' : '#b45309'}}>{note}</span>
                  : <span></span>}
                <span style={{color:'#94a3b8', whiteSpace:'nowrap'}}>{sub}</span>
              </div>
            </td>
          </tr>
        );

        // 대시보드 카드 9개와 1:1
        const KPI = {
          targetKRW: () => <Row key="targetKRW" label="Target" value={targetKRW} sub={usd(targetKRW)}
                                labelStyle={{color:'#b91c1c', background:'#fee2e2'}} valueStyle={{color:'#b91c1c'}}
                                editable onEdit={v=>handleTargetChange('target', v)} editColor="#b91c1c"/>,
          incentiveKRW: () => <Row key="incentiveKRW" label="Incentive Target ÷120%" value={incentiveTargetKRW} sub={usd(incentiveTargetKRW)}
                                labelStyle={{color:'#7c3aed'}} valueStyle={{color:'#6d28d9'}}
                                note={'ACT+SC ' + pIncentivePct.toFixed(1) + '%'} noteAhead={pIncentivePct>=100}/>,
          gapKRW: () => <Row key="gapKRW" label="GAP" value={pGap} sub={usd(pGap)}
                                valueStyle={{color: pGap<=0 ? '#047857' : '#b45309'}}
                                note={pGap<=0 ? '목표 초과' : '목표 미달'} noteAhead={pGap<=0}/>,
          estimatedKRW: () => <Row key="estimatedKRW" label="예상치 (ACT+SC)" value={pExpected} sub={usd(pExpected)}
                                labelStyle={{fontWeight:'900'}} valueStyle={{background:'#fef08a', fontWeight:'900', color:'#0f172a'}}
                                note={targetKRW ? 'vs Target ' + (pExpected/targetKRW*100).toFixed(1) + '%' : null}
                                noteAhead={targetKRW ? pExpected>=targetKRW : false}/>,
          shipConfirmKRW: () => <Row key="shipConfirmKRW" label="SC 예상치" value={pSc} sub={usd(pSc)}
                                valueStyle={{background:'#dbeafe', color:'#1d4ed8'}}/>,
          actEstimatedKRW: () => <Row key="actEstimatedKRW" label="ACT 예상치" value={pAct} sub={usd(pAct)}
                                valueStyle={{background:'#dcfce7', color:'#15803d'}}/>,
          gmppTarget: () => <Row key="gmppTarget" label="GMPP Target" value={gmppTargetKRW} sub={usd(gmppTargetKRW)}
                                labelStyle={{color:'#1d4ed8'}} valueStyle={{color:'#1d4ed8'}}
                                editable onEdit={v=>handleTargetChange('gmppTarget', v)} editColor="#1d4ed8"/>,
          gmppEstimated: () => <Row key="gmppEstimated" label="GMPP 예상치 (ACT+SC)" value={pGmppExp} sub={usd(pGmppExp)}
                                labelStyle={{color:'#1d4ed8'}}
                                note={'vs Target ' + pGmppPct.toFixed(1) + '%'} noteAhead={pGmppPct>=100}/>,
          gmppGap: () => <Row key="gmppGap" label="GMPP GAP" value={pGmppGap} sub={usd(pGmppGap)}
                                labelStyle={{color:'#1d4ed8'}} valueStyle={{color: pGmppGap<=0 ? '#047857' : '#b45309'}}
                                note={pGmppGap<=0 ? '목표 초과' : '목표 미달'} noteAhead={pGmppGap<=0}/>,
        };

        return (
          <div style={{background:'#fff', border:'1px solid #cbd5e1', borderRadius:'10px', padding:'10px', boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'8px', gap:'6px'}}>
              <div style={{fontSize:'12px', fontWeight:'900', color:'#0f172a'}}>{selectedQuarter} 요약</div>
              {summaryLocked
                ? <button onClick={() => unlockSummary()} title="Target 수정하려면 잠금 해제" style={{fontSize:'13px', padding:'1px 6px', borderRadius:'6px', border:'1.5px solid #fbbf24', background:'#fefce8', color:'#b45309', cursor:'pointer', fontWeight:'700'}}>🔒</button>
                : <button onClick={() => setSummaryLocked(true)} title="잠그기" style={{fontSize:'13px', padding:'1px 6px', borderRadius:'6px', border:'1.5px solid #86efac', background:'#f0fdf4', color:'#15803d', cursor:'pointer', fontWeight:'700'}}>🔓</button>}
            </div>

            {/* 행을 클릭해 고른 건들의 소계 - 고른 게 있을 때만 나온다 */}
            {pickedRowsInQ.length > 0 && (
              <div style={{marginBottom:'8px', border:'2px solid #2563eb', borderRadius:'8px', overflow:'hidden'}}>
                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:'6px', padding:'4px 6px', background:'#2563eb'}}>
                  <span style={{fontSize:'10px', fontWeight:'900', color:'#fff'}}>선택한 {pickedRowsInQ.length}건 소계</span>
                  <button onClick={clearPickedRows} style={{fontSize:'9px', fontWeight:'800', color:'#1d4ed8', background:'#fff', border:'none', borderRadius:'4px', padding:'1px 5px', cursor:'pointer'}}>해제</button>
                </div>
                <table style={{width:'100%', borderCollapse:'collapse', tableLayout:'fixed'}}>
                  <colgroup><col style={{width:'47%'}}/><col/></colgroup>
                  <tbody>
                    <tr>
                      <td style={{...L, background:'#eff6ff', color:'#1d4ed8'}}>합계</td>
                      <td style={{...V, background:'#eff6ff', color:'#1d4ed8', fontWeight:'900'}}>
                        <div style={{whiteSpace:'nowrap'}}>{won(pickedSumKRW)}</div>
                        <div style={{textAlign:'right', fontSize:'9px', fontWeight:'700', color:'#94a3b8'}}>{usd(pickedSumKRW)}</div>
                      </td>
                    </tr>
                    <tr>
                      <td style={{...L, background:'#eff6ff', color:'#1d4ed8'}}>Target 대비</td>
                      <td style={{...V, background:'#eff6ff', color: pickedTargetPct>=100 ? '#047857' : '#1d4ed8', fontWeight:'900'}}>{pickedTargetPct.toFixed(2)}%</td>
                    </tr>
                    <tr>
                      <td style={{...L, background:'#eff6ff', color:'#1d4ed8'}}>예상치 대비</td>
                      <td style={{...V, background:'#eff6ff', color:'#1d4ed8', fontWeight:'900'}}>{pickedExpectedPct.toFixed(2)}%</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            )}

            <table style={{width:'100%', borderCollapse:'collapse', tableLayout:'fixed'}}>
              <colgroup><col style={{width:'47%'}}/><col/></colgroup>
              <tbody>
                {cardOrder.filter(id => KPI[id]).map(id => KPI[id]())}
              </tbody>
            </table>

            {scenarioCount > 0 && (
              <div style={{marginTop:'8px', padding:'6px 8px', borderRadius:'6px', background:'#fff7ed', border:'1px dashed #fdba74', fontSize:'10px', fontWeight:'800', color:'#c2410c'}}>
                시나리오 {scenarioCount}건 반영된 숫자입니다 (저장 안 됨)
              </div>
            )}
            {applyCommission && (
              <div style={{marginTop:'6px', fontSize:'10px', fontWeight:'700', color:'#c2410c'}}>커미션 차감 반영됨</div>
            )}
          </div>
        );
      };

      // ── 팀 탭 + 팀 목표/멤버 리스트 + 전체 리스트 (사이드바 "TEAM n" 단독 진입 시에도 재사용) ──
      const renderTeamSection = () => (
        <>
          {/* 팀 탭 */}
          <div className="flex overflow-x-auto mb-4 border-b pb-[1px] hide-scrollbar" data-region="team-tabs">
            {Object.keys(teams).sort().map(team => (
              <button key={team} onClick={() => { setSelectedTeam(team); setSelectedMember(null); setEditingId(null); setForm(initialForm); }} className={`whitespace-nowrap px-6 md:px-8 py-3 font-bold rounded-t-lg transition ${selectedTeam===team?'bg-blue-600 text-white shadow-md':'bg-gray-200 text-gray-500 hover:bg-gray-300 hover:text-gray-700'}`}>{team}</button>
            ))}
            <button onClick={addTeam} className="whitespace-nowrap px-4 md:px-6 py-3 font-bold rounded-t-lg text-blue-600 bg-blue-50 border border-blue-200 border-b-0 hover:bg-blue-100 transition">{T.addTab}</button>
          </div>

          <div className="flex flex-col gap-6 mb-10">
            {/* 팀 달성률 + 멤버 카드 */}
            <div className="w-full">
              {(() => {
                const teamActKRW = (teams[selectedTeam]||[]).reduce((s,m) => s + (memberStats[m]?.sumKRW||0) + (memberStats[m]?.actKRW||0), 0);
                const teamTarget = teamTargets[selectedTeam]?.[selectedQuarter] || 0;
                const teamPer    = teamTarget > 0 ? (teamActKRW / teamTarget) * 100 : 0;
                // ── 3-zone ascending achievement family, same hue tokens as the header bar ──
                const teamZone   = teamPer>=120?3:teamPer>=100?2:1;
                const perColor   = teamZone===3?'#047857':teamZone===2?'#1d4ed8':'#475569';
                return (
                  <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-4" style={{maxWidth:'420px'}} data-region="team-progress-bar">
                    <div className="flex justify-between items-center mb-3">
                      <span className="font-extrabold text-gray-800 text-base">{selectedTeam}</span>
                      <span className="font-extrabold text-lg" style={{color:perColor}}>{teamTarget>0?`${teamPer.toFixed(1)}%`:'-'}</span>
                    </div>
                    <div className="flex items-center gap-1 mb-3 bg-slate-50 rounded-lg px-3 py-2 border border-slate-200">
                      <span className="text-[11px] font-bold text-slate-500 whitespace-nowrap">🎯 팀 목표</span>
                      <span className="text-slate-400 font-bold text-xs mx-1">₩</span>
                      <input type="number" min="0" value={teamTargets[selectedTeam]?.[selectedQuarter]||''} onChange={e=>handleTeamTargetChange(selectedTeam,selectedQuarter,e.target.value)} placeholder="목표 금액 입력" className="flex-1 bg-transparent text-right font-mono font-bold text-sm outline-none text-slate-800 min-w-0" style={{borderBottom:'1.5px solid #cbd5e1'}}/>
                    </div>
                    <div className="flex justify-between text-[11px] font-semibold text-gray-500">
                      <span>{lang==='ko'?'누적 달성 (SC+ACT 기준)':'Cumulative (SC+ACT)'}</span>
                      <span className="font-mono font-bold text-gray-700">₩ {teamActKRW.toLocaleString()}</span>
                    </div>
                  </div>
                );
              })()}
              <div className="flex justify-between items-center mb-3">
                <h3 className="text-base font-bold text-gray-700">{selectedTeam} {T.memberList}</h3>
                <button onClick={addMember} className="text-xs bg-blue-100 text-blue-700 font-bold px-3 py-1.5 rounded shadow-sm hover:bg-blue-200 transition">{T.addMember}</button>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                {teams[selectedTeam].length===0 ? (
                  <div className="p-8 text-center text-gray-400 bg-white rounded-xl border border-dashed border-gray-300">{T.noMembers}</div>
                ) : (
                  teams[selectedTeam].map(member => {
                    const mScKRW    = memberStats[member]?.sumKRW || 0;   // Ship Confirm 누적
                    const mActKRW   = memberStats[member]?.actKRW || 0;   // ACT 누적
                    const mTotalKRW = mScKRW + mActKRW;
                    const mTarget = currentMemberTargets[member] || 0;
                    const mPer      = mTarget > 0 ? (mScKRW/mTarget)*100 : 0;   // SC 대비 타겟 달성률
                    const mActPer   = mTarget > 0 ? (mActKRW/mTarget)*100 : 0;
                    const mTotalPer = mPer + mActPer;                           // SC+ACT 합계 달성률
                    // ── same 3-zone ascending family as the header/team bars; no boundary labels (no room) ──
                    const mZone      = mTotalPer>=120?3:mTotalPer>=100?2:1;
                    const mPerColorHex = mZone===3?'#047857':mZone===2?'#1d4ed8':'#475569';
                    // 막대는 목표(100%)까지를 폭 100%로 두고 SC:ACT 비율 그대로 쌓는다 - SC 혼자 100%를 넘겨도
                    // ACT가 0으로 밀려나지 않도록 합계가 100%를 넘으면 두 값을 비율 유지한 채 같이 줄인다
                    const mBarScale = mTotalPer > 100 ? 100/mTotalPer : 1;
                    const mScW  = mPer * mBarScale;
                    const mActW = mActPer * mBarScale;
                    const mCount  = memberStats[member]?.count || 0;
                    const mActCount = memberStats[member]?.actCount || 0;
                    return (
                      <div key={member} onClick={() => setSelectedMember(member)} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-md hover:border-blue-300 hover:-translate-y-0.5 transition-all group relative">
                        <div className="flex justify-between items-start mb-2">
                          <div><div className="text-base font-extrabold text-gray-800 group-hover:text-blue-600">{member}</div><div className="text-[10px] text-gray-400 mt-0.5">SC {mCount}{T.cases} · ACT {mActCount}{T.cases}</div></div>
                          <div className="flex gap-1" onClick={e=>e.stopPropagation()}>
                            <button onClick={e=>editMemberName(member,e)} className="text-[10px] text-gray-400 hover:text-blue-600 bg-gray-100 hover:bg-blue-50 px-1.5 py-1 rounded border transition">{T.rename}</button>
                            <button onClick={e=>deleteMember(member,e)} className="text-[10px] text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 px-1.5 py-1 rounded border border-red-200 transition">{T.delete}</button>
                          </div>
                        </div>
                        {mTarget<=0 ? (
                          <div className="flex justify-between items-end mb-1.5">
                            <span className="text-[11px] font-mono font-bold text-gray-700">₩ {mTotalKRW.toLocaleString()}</span>
                            <span className="text-xs font-extrabold" style={{color:'#94a3b8'}}>목표 미설정</span>
                          </div>
                        ) : renderSimpleProgressBar(mScKRW, mActKRW, mTarget)}
                      </div>
                    );
                  })
                )}
              </div>
            </div>

            {/* 팀 대시보드: 목표 대비 현재 + 장비별 대수 */}
            {(() => {
              const teamQRows = salesData.filter(d => d.quarter===selectedQuarter && d.team===selectedTeam && isRevenue(d));
              const scAmt = teamQRows.filter(d=>d.status==='Ship Confirm').reduce((s,d)=>s+(d.priceKRW||0),0);
              const actAmt = teamQRows.filter(d=>d.status==='ACT').reduce((s,d)=>s+(d.priceKRW||0),0);
              const teamActKRW = scAmt + actAmt;
              const teamTargetKRW = teamTargets[selectedTeam]?.[selectedQuarter] || 0;
              const byProduct = {};
              teamQRows.forEach(d => { byProduct[d.product] = (byProduct[d.product]||0) + 1; });
              const products = Object.keys(byProduct).sort();
              const currentYear = (selectedQuarter||'').split(' ')[0];
              const quarterlyStats = {};
              ['Q1','Q2','Q3','Q4'].forEach(q => {
                const qRows = salesData.filter(d => d.quarter===`${currentYear} ${q}` && d.team===selectedTeam && isRevenue(d));
                quarterlyStats[q] = { count: qRows.length, sumKRW: qRows.reduce((s,d)=>s+(d.priceKRW||0),0) };
              });
              return (
                <div className="flex-1 min-w-0">
                  <h3 className="text-lg md:text-xl font-bold text-gray-700 flex items-center gap-2 mb-4">📊 {selectedTeam} 대시보드<span className="text-sm text-gray-400 font-normal">({selectedQuarter})</span></h3>
                  <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6 mb-4">
                    {teamTargetKRW>0 ? renderSimpleProgressBar(scAmt, actAmt, teamTargetKRW) : (
                      <div className="flex flex-wrap justify-between items-end gap-2">
                        <span className="text-sm font-bold text-gray-400">목표 미설정</span>
                        <span className="text-sm font-bold text-gray-600">현재 ₩ {teamActKRW.toLocaleString()}</span>
                      </div>
                    )}
                  </div>
                  <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6">
                    <h4 className="text-sm font-bold text-gray-600 mb-3">장비별 대수 <span className="text-xs text-gray-400 font-semibold">(SC+ACT 기준)</span></h4>
                    {products.length === 0 ? (
                      <div className="text-gray-400 text-sm">데이터 없음</div>
                    ) : (
                      <div className="flex flex-wrap gap-3">
                        {products.map(p => (
