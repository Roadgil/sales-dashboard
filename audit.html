<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Log · Candela Korea</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
<style>
/* Pretendard Variable — self-hosted subsets, shared with index.html (see .omd/type-proof.md).
   Two subsets so the browser only fetches the glyphs a given code point needs; both subsets
   were extended to also cover this page's own Korean/symbol copy (audit log labels, action
   icons, pagination arrows) without removing any glyph index.html already relies on. */
@font-face {
  font-family: 'Pretendard Variable';
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
  src: url('./fonts/PretendardVariable-subset-hangul.woff2') format('woff2-variations');
  unicode-range: U+AC00-D7A3, U+1100-11FF, U+3130-318F, U+A960-A97F, U+D7B0-D7FF;
}
@font-face {
  font-family: 'Pretendard Variable';
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
  src: url('./fonts/PretendardVariable-subset-latin-num.woff2') format('woff2-variations');
  unicode-range: U+0020-007E, U+00B7, U+2014, U+20A9, U+FF01-FF60;
}

:root {
  /* Toss-anchor quiet register — same tokens as index.html's .toss-panel/.qsg-* block
     (.omd/scout-toss.md, candidate "toss-quiet-numeral-focus"). Near-flat cards, hairline
     neutral borders, one scarce interactive blue. */
  --bg:#f3f4f6;          /* gray-100, matches index.html's <body className="bg-gray-100"> */
  --surf:#fff;
  --border:#e5e8eb;      /* toss grey200 hairline */
  --text:#191f28;        /* toss grey900 */
  --muted:#4e5968;       /* toss grey700 */
  --muted-2:#8b95a1;     /* toss grey500 */
  --grey100:#f2f4f6;     /* toss grey100 */
  --accent:#3182f6;      /* toss blue500 — the one scarce interactive accent */
  --accent-dark:#2272eb; /* toss blue600 hover/pressed */
  --focus-ring:#3182f6;

  /* Signed-delta pair — reused identically from index.html's .sld-badge (ahead/behind) for the
     create/delete action badges and the diff before/after values: same hue-to-meaning mapping,
     not an arbitrary new palette. Kept exactly as-is per the Toss pass's own instruction to keep
     this convention, only restrained (never a solid fill), within the quieter register. */
  --pos:#047857;      --pos-bg:#e2f7f0;   --pos-ring:rgba(16,185,129,.35);
  --neg:#b91c1c;       --neg-bg:#fbe9e9;   --neg-ring:rgba(220,38,38,.32);
  --neu:#b45309;       --neu-bg:#fdf3d9;   --neu-ring:rgba(217,119,6,.32); /* same pre-composited-tint formula, for the neutral "edit" action */

  /* Record-status tokens — identical hex to index.html's own STATUS_COLOR map (Ship Confirm/
     ACT/Pending/Back up), so a status reads the same color on both pages. */
  --st-sc-bg:#1e3a8a;    --st-sc-fg:#fff;      /* Ship Confirm */
  --st-act-bg:#dcfce7;   --st-act-fg:#15803d;  /* ACT */
  --st-pending-bg:#dbeafe; --st-pending-fg:#1d4ed8; /* Pending */
  --st-backup-bg:#ffedd5; --st-backup-fg:#c2410c;   /* Back up */
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard Variable',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji";font-size:13px;min-height:100vh;}

/* ── 로그인 ── */
.login-wrap{display:flex;height:100vh;align-items:center;justify-content:center;background:#0f172a;}
.login-box{background:#fff;border-radius:16px;padding:40px 36px;width:340px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.28);}
.login-icon{font-size:36px;margin-bottom:12px;}
.login-title{font-size:24px;font-weight:800;margin-bottom:6px;}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:24px;font-weight:500;}
.login-input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;letter-spacing:1px;text-align:center;outline:none;margin-bottom:8px;transition:border .2s;}
.login-input:focus{border-color:var(--accent);}
.login-input.error{border-color:var(--neg);}
.login-err{font-size:12px;color:var(--neg);font-weight:700;margin-bottom:10px;min-height:18px;}
.login-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s;}
.login-btn:hover{background:var(--accent-dark);}

/* ── 레이아웃 ── */
.wrap{max-width:1400px;margin:0 auto;padding:32px 24px;}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);}
h1{font-size:30px;font-weight:800;line-height:1;margin-bottom:4px;color:var(--text);}
h1 span{color:var(--accent);}
.sub{font-size:12px;font-weight:500;color:var(--muted);}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 12px;border:1px solid var(--border);border-radius:999px;transition:all .2s;margin-bottom:10px;}
.back-link:hover{color:var(--accent);border-color:var(--accent);}

/* ── 필터 바 ── */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
.filter-bar select, .filter-bar input{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;background:#fff;outline:none;transition:border .2s;cursor:pointer;}
.filter-bar select:focus, .filter-bar input:focus{border-color:var(--accent);}
.filter-bar input{min-width:200px;}
/* Same amber "clear filters" chip index.html uses (bg-amber-100/text-amber-700/border-amber-300) — untouched by the Toss pass there, kept identical here */
.btn-reset{padding:6px 14px;border:1px solid #fcd34d;border-radius:999px;background:#fef3c7;font-size:11px;font-weight:700;cursor:pointer;color:#b45309;transition:all .2s;}
.btn-reset:hover{background:#fde68a;}
.count-badge{font-size:11px;font-weight:600;color:var(--muted-2);background:var(--grey100);padding:4px 12px;border-radius:999px;margin-left:auto;}

/* ── 통계 카드 ── Toss quiet register: flat white, hairline border, no shadow, fixed height
   so all 4 cards measure identically regardless of label length. Color is carried by a small
   status dot (index.html's own toss-threshold-card pattern), never by the whole card or the
   big figure — the number itself stays neutral so color stays reserved for meaning. */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:700px){.stats-row{grid-template-columns:1fr 1fr;}}
.stat-card{height:88px;box-sizing:border-box;background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:none;}
.stat-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;}
.stat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.stat-card.s-total .stat-dot{background:var(--accent);}
.stat-card.s-create .stat-dot{background:var(--pos);}
.stat-card.s-edit .stat-dot{background:var(--neu);}
.stat-card.s-delete .stat-dot{background:var(--neg);}
.stat-val{font-size:24px;font-weight:800;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;}

/* ── 로그 테이블 ── flat card chrome: hairline border, no shadow, 14px radius */
.table-wrap{background:var(--surf);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:none;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-scroll::-webkit-scrollbar{height:7px;}
.table-scroll::-webkit-scrollbar-track{background:#f1f5f9;border-radius:4px;}
.table-scroll::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:4px;}
.table-scroll::-webkit-scrollbar-thumb:hover{background:#64748b;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{background:#334155;} /* slate-700 — same neutral ledger-header treatment as index.html's data tables */
th{font-weight:700;font-size:11px;color:#fff;padding:10px 12px;text-align:left;white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--grey100);}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:11px;}

/* ── Action 배지 — same pill/pre-composited-tint/inset-ring anatomy as index.html's .sld-badge ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.01em;white-space:nowrap;line-height:1.5;}
.badge-create{background:var(--pos-bg);color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos-ring);}
.badge-edit{background:var(--neu-bg);color:var(--neu);box-shadow:inset 0 0 0 1px var(--neu-ring);}
.badge-delete{background:var(--neg-bg);color:var(--neg);box-shadow:inset 0 0 0 1px var(--neg-ring);}

/* ── diff 뷰 ── */
.diff-btn{padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:10px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s;}
.diff-btn:hover{border-color:var(--accent);color:var(--accent);}
.diff-panel{display:none;margin-top:8px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:11px;}
.diff-panel.open{display:block;}
.diff-row{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #eef0f4;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;}
.diff-row:last-child{border-bottom:none;}
.diff-field{color:var(--muted);min-width:90px;flex-shrink:0;font-family:'Pretendard Variable',sans-serif;font-weight:600;}
.diff-before{color:var(--neg);text-decoration:line-through;flex:1;}
.diff-after{color:var(--pos);flex:1;}
.diff-same{color:var(--text);flex:1;}

/* ── 페이지네이션 ── */
.pagination{display:flex;justify-content:center;gap:6px;margin-top:20px;flex-wrap:wrap;}
.pg-btn{padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;}
.pg-btn:hover{border-color:var(--accent);color:var(--accent);}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.pg-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ── 로딩 ── */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:12px;color:var(--muted);font-size:12px;font-weight:500;}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;color:var(--muted);font-size:10px;font-weight:500;}

/* ── finish pass: selection, focus ring, scrollbar (craft/finish-pass.md, matches index.html) ── */
::selection { background-color: rgba(49,130,246,0.22); color: #0f172a; }
:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--focus-ring);
}
:root { scrollbar-color: var(--muted-2) transparent; scrollbar-width: thin; }
</style>
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <div class="login-title">Audit <span style="color:var(--accent)">Log</span></div>
    <div class="login-sub">Candela Korea · 변경 이력 뷰어</div>
    <input type="email" class="login-input" id="emailInput" placeholder="Email" onkeydown="if(event.key==='Enter')doLogin()" style="margin-bottom:8px"/>
    <input type="password" class="login-input" id="pwdInput" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <div class="login-err" id="loginErr"></div>
    <button class="login-btn" onclick="doLogin()">접속하기</button>
  </div>
</div>

<!-- ── 메인 화면 ── -->
<div class="wrap" id="mainWrap" style="display:none">
  <a class="back-link" href="index.html">← Dashboard로 돌아가기</a>
  <header>
    <div>
      <h1>Audit <span>Log</span></h1>
      <div class="sub">Candela Korea · 데이터 변경 이력</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:11px;font-weight:500;color:var(--muted)" id="lastUpdated">--</div>
      <button onclick="doLogout()" style="margin-top:8px;padding:5px 14px;border:1.5px solid var(--border);border-radius:999px;background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);">로그아웃</button>
    </div>
  </header>

  <!-- 통계 카드 — Toss quiet register: flat card, status dot carries meaning, value stays neutral -->
  <div class="stats-row">
    <div class="stat-card s-total"><div class="stat-label"><span class="stat-dot"></span>Total Logs</div><div class="stat-val" id="st-total">-</div></div>
    <div class="stat-card s-create"><div class="stat-label"><span class="stat-dot"></span>신규 저장</div><div class="stat-val" id="st-create">-</div></div>
    <div class="stat-card s-edit"><div class="stat-label"><span class="stat-dot"></span>수정</div><div class="stat-val" id="st-edit">-</div></div>
    <div class="stat-card s-delete"><div class="stat-label"><span class="stat-dot"></span>삭제</div><div class="stat-val" id="st-delete">-</div></div>
  </div>

  <!-- 필터 바 -->
  <div class="filter-bar">
    <select id="fAction" onchange="applyFilters()">
      <option value="">전체 액션</option>
      <option value="create">신규 저장</option>
      <option value="edit">수정</option>
      <option value="delete">삭제</option>
    </select>
    <select id="fMember" onchange="applyFilters()">
      <option value="">전체 담당자</option>
    </select>
    <select id="fQuarter" onchange="applyFilters()">
      <option value="">전체 분기</option>
    </select>
    <input type="text" id="fSearch" placeholder="🔍  Account / 제품 검색..." oninput="applyFilters()"/>
    <button class="btn-reset" onclick="resetFilters()">초기화</button>
    <span class="count-badge" id="countBadge">-- 건</span>
  </div>

  <!-- 로그 테이블 -->
  <div class="table-wrap">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:150px">시각</th>
            <th style="width:80px">액션</th>
            <th>변경자</th>
            <th>담당자</th>
            <th>분기</th>
            <th>Account</th>
            <th>제품</th>
            <th>상태</th>
            <th style="text-align:right">금액 (KRW)</th>
            <th style="width:70px">변경내역</th>
          </tr>
        </thead>
        <tbody id="logBody">
          <tr><td colspan="10"><div class="loading"><div class="spinner"></div>Loading…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="pagination" id="pagination"></div>

  <footer>
    <span>Source: Firebase Firestore · audit_logs collection</span>
    <span>Candela Korea Sales Ops</span>
  </footer>
</div>

<script>
const PAGE_SIZE       = 30;

// ── Firebase ──────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyDpdX6I7fkE1m9jQDARg5l4Skv3vhD7iyI",
  authDomain: "sales-dashboard-d0d13.firebaseapp.com",
  projectId: "sales-dashboard-d0d13",
  storageBucket: "sales-dashboard-d0d13.firebasestorage.app",
  messagingSenderId: "870275096697",
  appId: "1:870275096697:web:cd7373b77358681e21b4a8"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// ── 로그인 (Firebase Auth) ─────────────────────────────────────────────────
let logsLoaded = false;
function showLoginError(msg) {
  const inp = document.getElementById('pwdInput');
  inp.classList.add('error');
  document.getElementById('loginErr').textContent = msg;
  inp.value = '';
  setTimeout(() => { inp.classList.remove('error'); document.getElementById('loginErr').textContent = ''; }, 2500);
}
function doLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const pwd   = document.getElementById('pwdInput').value;
  if (!email || !pwd) { showLoginError('❌ 이메일과 비밀번호를 입력하세요.'); return; }
  auth.signInWithEmailAndPassword(email, pwd)
    .catch(() => showLoginError('❌ 이메일 또는 비밀번호가 올바르지 않습니다.'));
}
function doLogout() {
  auth.signOut().then(() => location.reload());
}
const AUDIT_VIEWER_EMAILS = ['hannap@candelamedical.com','yunap@candelamedical.com','miaej@candelamedical.com','yoongil.chae@candelamedical.com','bohyunk@candelamedical.com'];
auth.onAuthStateChanged(user => {
  if (user) {
    if (!AUDIT_VIEWER_EMAILS.includes((user.email||'').toLowerCase())) {
      auth.signOut();
      showLoginError('⛔ 감사 로그 열람 권한이 없는 계정입니다.');
      return;
    }
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('mainWrap').style.display  = 'block';
    if (!logsLoaded) { logsLoaded = true; loadLogs(); }
  } else {
    document.getElementById('loginWrap').style.display = '';
    document.getElementById('mainWrap').style.display  = 'none';
  }
});

// ── 데이터 ───────────────────────────────────────────────────────────────
let allLogs = [];
let filtered = [];
let currentPage = 1;

function loadLogs() {
  db.collection("audit_logs")
    .orderBy("timestamp", "desc")
    .onSnapshot(snap => {
      allLogs = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
      buildFilterOptions();
      applyFilters();
      updateStats();
      const el = document.getElementById('lastUpdated');
      if (el) el.textContent = '마지막 업데이트: ' + new Date().toLocaleTimeString('ko-KR');
    }, err => {
      // orderBy 인덱스 없을 경우 fallback
      db.collection("audit_logs").get().then(snap => {
        allLogs = snap.docs.map(d => ({ _id: d.id, ...d.data() }))
          .sort((a,b) => (b.timestamp||'').localeCompare(a.timestamp||''));
        buildFilterOptions();
        applyFilters();
        updateStats();
      });
    });
}

function buildFilterOptions() {
  const members  = [...new Set(allLogs.map(l => l.member).filter(Boolean))].sort();
  const quarters = [...new Set(allLogs.map(l => l.quarter).filter(Boolean))].sort().reverse();

  const fMember = document.getElementById('fMember');
  const cur = fMember.value;
  fMember.innerHTML = '<option value="">전체 담당자</option>' +
    members.map(m => `<option value="${m}">${m}</option>`).join('');
  fMember.value = cur;

  const fQuarter = document.getElementById('fQuarter');
  const curQ = fQuarter.value;
  fQuarter.innerHTML = '<option value="">전체 분기</option>' +
    quarters.map(q => `<option value="${q}">${q}</option>`).join('');
  fQuarter.value = curQ;
}

function updateStats() {
  document.getElementById('st-total').textContent  = allLogs.length;
  document.getElementById('st-create').textContent = allLogs.filter(l=>l.action==='create').length;
  document.getElementById('st-edit').textContent   = allLogs.filter(l=>l.action==='edit').length;
  document.getElementById('st-delete').textContent = allLogs.filter(l=>l.action==='delete').length;
}

function applyFilters() {
  const action  = document.getElementById('fAction').value;
  const member  = document.getElementById('fMember').value;
  const quarter = document.getElementById('fQuarter').value;
  const search  = document.getElementById('fSearch').value.toLowerCase().trim();

  filtered = allLogs.filter(l => {
    if (action  && l.action  !== action)  return false;
    if (member  && l.member  !== member)  return false;
    if (quarter && l.quarter !== quarter) return false;
    if (search) {
      const hay = [l.account, l.member, (l.after||l.before||{}).product, (l.after||l.before||{}).status].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  document.getElementById('countBadge').textContent = `${filtered.length}건`;
  currentPage = 1;
  renderTable();
  renderPagination();
}

function resetFilters() {
  document.getElementById('fAction').value  = '';
  document.getElementById('fMember').value  = '';
  document.getElementById('fQuarter').value = '';
  document.getElementById('fSearch').value  = '';
  applyFilters();
}

// ── 렌더 ─────────────────────────────────────────────────────────────────
const ACTION_LABEL = { create:'신규 저장', edit:'수정', delete:'삭제' };
const ACTION_BADGE = { create:'badge-create', edit:'badge-edit', delete:'badge-delete' };
const ACTION_ICON  = { create:'✚', edit:'✎', delete:'✕' };

function fmtTime(iso) {
  if (!iso) return '-';
  try {
    const d = new Date(iso);
    const ymd = d.toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' });
    const hms = d.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    return `<span style="display:block">${ymd}</span><span class="mono" style="color:var(--muted);font-size:10px">${hms}</span>`;
  } catch { return iso; }
}

function fmtKRW(v) {
  if (!v) return '-';
  return '₩ ' + Number(v).toLocaleString();
}

const DIFF_FIELDS = [
  { key:'status',       label:'Status' },
  { key:'priceKRW',     label:'금액(KRW)' },
  { key:'deliveryDate', label:'납품예정일' },
  { key:'contractDate', label:'계약일' },
  { key:'account',      label:'Account' },
  { key:'product',      label:'제품' },
  { key:'accType',      label:'Acc type' },
  { key:'dealerName',   label:'Dealer' },
  { key:'contractType', label:'계약구분' },
  { key:'so',           label:'SO' },
];

function buildDiff(before, after) {
  if (!before && !after) return '';
  const b = before || {};
  const a = after  || {};
  const rows = DIFF_FIELDS.map(f => {
    const bv = String(b[f.key] ?? '');
    const av = String(a[f.key] ?? '');
    if (bv === av) return null; // 변경 없으면 생략
    return `<div class="diff-row">
      <span class="diff-field">${f.label}</span>
      <span class="diff-before">${bv || '(없음)'}</span>
      <span style="color:var(--muted);padding:0 4px">→</span>
      <span class="diff-after">${av || '(없음)'}</span>
    </div>`;
  }).filter(Boolean);
  if (!rows.length) return '<div style="color:var(--muted);font-size:11px;padding:4px 0">변경된 필드 없음</div>';
  return rows.join('');
}

function toggleDiff(id) {
  const panel = document.getElementById('diff-' + id);
  if (panel) panel.classList.toggle('open');
}

function renderTable() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page  = filtered.slice(start, start + PAGE_SIZE);
  const tbody = document.getElementById('logBody');

  if (!page.length) {
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--muted);font-weight:500;">로그가 없습니다.</td></tr>`;
    return;
  }

  tbody.innerHTML = page.map((log, i) => {
    const idx    = start + i;
    const data   = log.after || log.before || {};
    const hasDiff = log.action === 'edit' && log.before;
    const diffContent = hasDiff ? buildDiff(log.before, log.after) : '';

    return `<tr>
      <td>${fmtTime(log.timestamp)}</td>
      <td><span class="badge ${ACTION_BADGE[log.action]||'badge-edit'}">${ACTION_ICON[log.action]||''} ${ACTION_LABEL[log.action]||log.action}</span></td>
      <td class="mono" style="font-size:11px;color:var(--text);font-weight:700">${log.actor ? log.actor.split('@')[0] : '-'}</td>
      <td class="mono" style="font-size:12px">${log.member||'-'}<br><span style="color:var(--muted);font-size:10px">${log.team||''}</span></td>
      <td class="mono">${log.quarter||'-'}</td>
      <td style="font-weight:600;max-width:160px;word-break:break-all">${log.account||data.account||'-'}</td>
      <td class="mono">${data.product||'-'}</td>
      <td>
        <span style="font-size:11px;padding:2px 9px;border-radius:999px;background:${
          data.status==='Ship Confirm'?'var(--st-sc-bg)':
          data.status==='ACT'?'var(--st-act-bg)':
          data.status==='Pending'?'var(--st-pending-bg)':'var(--st-backup-bg)'
        };color:${
          data.status==='Ship Confirm'?'var(--st-sc-fg)':
          data.status==='ACT'?'var(--st-act-fg)':
          data.status==='Pending'?'var(--st-pending-fg)':'var(--st-backup-fg)'
        };font-weight:700">${data.status||'-'}</span>
      </td>
      <td style="text-align:right" class="mono">${fmtKRW(data.priceKRW)}</td>
      <td>
        ${hasDiff
          ? `<button class="diff-btn" onclick="toggleDiff('${log._id}')">diff</button>
             <div class="diff-panel" id="diff-${log._id}">${diffContent}</div>`
          : log.action === 'delete'
            ? `<span style="font-size:10px;color:var(--neg);font-weight:600">삭제됨</span>`
            : `<span style="font-size:10px;color:var(--muted);font-weight:500">-</span>`
        }
      </td>
    </tr>`;
  }).join('');
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const pg = document.getElementById('pagination');
  if (total <= 1) { pg.innerHTML = ''; return; }

  let html = `<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ 이전</button>`;

  const start = Math.max(1, currentPage - 2);
  const end   = Math.min(total, currentPage + 2);
  if (start > 1) html += `<button class="pg-btn" onclick="goPage(1)">1</button>${start>2?'<span style="padding:0 4px;color:var(--muted)">…</span>':''}`;
  for (let i = start; i <= end; i++) {
    html += `<button class="pg-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (end < total) html += `${end<total-1?'<span style="padding:0 4px;color:var(--muted)">…</span>':''}<button class="pg-btn" onclick="goPage(${total})">${total}</button>`;
  html += `<button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>다음 ›</button>`;
  pg.innerHTML = html;
}

function goPage(p) {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  if (p < 1 || p > total) return;
  currentPage = p;
  renderTable();
  renderPagination();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 로그인 상태 감지는 auth.onAuthStateChanged에서 처리
</script>
</body>
</html>
